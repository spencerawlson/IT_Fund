<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Theme before first paint: apply the stored choice (or the OS
         preference when nothing is stored) before the stylesheet loads, so
         dark-mode visitors never flash the light theme. Mirrors the logic in
         src/lib/theme.js — keep the two in sync. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('itfund-theme');
          var theme = stored === 'dark' || stored === 'light'
            ? stored
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#000000' : '#FFFFFF');
        } catch (e) { /* storage unavailable: light default stands */ }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Road to CISSP — Networking, Security, Python, Cloud & Cybersecurity Training</title>
    <meta name="description" content="Road to CISSP — the go-to platform for networking, security, Python, cloud, and cybersecurity training. Thousands of flashcards, guided lessons, hands-on labs, and 3D visual explainers, from IT foundations to the CISSP." />
    <link rel="canonical" href="https://www.road2cissp.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Road to CISSP" />
    <meta property="og:url" content="https://www.road2cissp.com/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Road to CISSP — Networking, Security, Python, Cloud & Cybersecurity Training" />
    <meta property="og:description" content="Master networking, security, Python, cloud, and cybersecurity — flashcards, guided lessons, hands-on labs, and 3D visual explainers, from IT foundations to the CISSP." />
    <meta property="og:image" content="https://www.road2cissp.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Road to CISSP — networking, security and cybersecurity training" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Road to CISSP — Networking, Security, Python, Cloud & Cybersecurity Training" />
    <meta name="twitter:description" content="Master networking, security, Python, cloud, and cybersecurity — flashcards, guided lessons, hands-on labs, and 3D visual explainers, from IT foundations to the CISSP." />
    <meta name="twitter:image" content="https://www.road2cissp.com/og-image.png" />
    <meta name="twitter:image:alt" content="Road to CISSP — networking, security and cybersecurity training" />

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#FFFFFF" />

    <!-- Site-wide structured data. One WebSite node (not @graph): its types
         are readable by any consumer that only reads a top-level @type.
         The membership Product/Offer (with the price) is injected on
         /pricing from the live Stripe price, so the price is asserted in
         exactly one place (see src/pages/Pricing.jsx). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "@id": "https://www.road2cissp.com/#website",
        "url": "https://www.road2cissp.com/",
        "name": "Road to CISSP",
        "description": "Networking, security, Python, cloud, and cybersecurity training from IT foundations to the CISSP.",
        "inLanguage": "en",
        "publisher": {
          "@type": "Organization",
          "@id": "https://www.road2cissp.com/#org",
          "name": "Road to CISSP",
          "url": "https://www.road2cissp.com/",
          "logo": "https://www.road2cissp.com/favicon.svg"
        }
      }
    </script>

    <!-- Analytics: Plausible (privacy-friendly, no cookies). The tag only
         counts visits once a Plausible account exists for road2cissp.com
         and the site is added there — until Spencer creates that account
         it sends nothing useful. -->
    <script defer data-domain="road2cissp.com" src="https://plausible.io/js/script.js"></script>
    <!-- Ventoryn Analytics: first-party, cookieless (no cookies, no storage, no personal data). -->
    <script defer data-site="418e926be25e251d95badb9e" src="https://ventoryn.app/v.js"></script>
  </head>
  <body>
    <div id="root"></div>
