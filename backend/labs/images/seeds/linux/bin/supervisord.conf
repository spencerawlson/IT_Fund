; User-level supervisord config for the linux-admin lab image.
; systemd cannot run as PID 1 in an unprivileged container, so supervisord manages the
; linux-services-001 lab services instead. Students drive it with supervisorctl
; (use -c ~/supervisord.conf, or the /usr/local/bin wrapper that adds it).
[unix_http_server]
file=/home/student/supervisor.sock
chmod=0700

[supervisord]
logfile=/home/student/supervisor.log
pidfile=/home/student/supervisord.pid

[supervisorctl]
serverurl=unix:///home/student/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[include]
files=/home/student/services/conf.d/*.conf
