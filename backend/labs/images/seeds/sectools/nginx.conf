# Minimal nginx config for the recon lab: serves on 8080 as an unprivileged user.
# (The hardened provider drops CAP_NET_BIND_SERVICE, so port 80 is unavailable.)
user student;
worker_processes 1;
pid /home/student/nginx.pid;
error_log /home/student/nginx_error.log warn;
events { worker_connections 64; }
http {
    include /etc/nginx/mime.types;
    access_log /home/student/nginx_access.log;
    server {
        listen 8080;
        root /home/student/www;
        index index.html;
    }
}
