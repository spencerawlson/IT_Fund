# ALTERNATIVE PATH: only needed if you manage the tunnel from the cloudflared
# CLI instead of the Zero Trust dashboard. With a dashboard-managed tunnel
# (Public Hostnames configured in the UI, connector running with --token),
# this file is not used at all.
# Cloudflare named-tunnel config for the IT_Fund backend.
# Copy to ~/.config/itfund/config.yml and replace <TUNNEL_ID> with the UUID
# from `cloudflared tunnel create itfund-backend`. The credentials-file path
# is the default location where the create command stores the tunnel JSON.

tunnel: <TUNNEL_ID>
credentials-file: ~/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: api.road2cissp.com
    service: http://localhost:8001
  - service: http_status:404
