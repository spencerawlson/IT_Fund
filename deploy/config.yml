# Cloudflare named-tunnel config for the IT_Fund backend.
# Copy to ~/.config/itfund/config.yml and replace the placeholders:
#   <TUNNEL_ID>        — the UUID from `cloudflared tunnel create itfund-backend`
#   <TUNNEL_HOSTNAME>  — the public hostname, e.g. api.spencerlab.tech
# The credentials-file path is where `cloudflared tunnel create` stores the
# tunnel's JSON credentials by default.

tunnel: <TUNNEL_ID>
credentials-file: /home/spencer/.cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: <TUNNEL_HOSTNAME>
    service: http://localhost:8000
  - service: http_status:404
