name: Mobile builds

# Builds the Capacitor shells. iOS needs Xcode, so it runs on a macOS runner (free for public repos):
# it builds for the Simulator (no Apple signing needed), installs and launches the app on a
# simulated iPhone, and uploads a screenshot plus the .app. Android builds a debug APK you can
# sideload and, when the upload-key secrets exist, a signed .aab for Google Play.
# Only runs when mobile-related files change, or on demand from the Actions tab, where
# "testflight" also uploads an iOS build to TestFlight (needs the Apple secrets, see that job).
on:
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Also upload an iOS build to TestFlight (needs Apple secrets)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  # The bundled app has no same-origin /api, so it must call the API origin directly.
  VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://api.road2cissp.com/api' }}

jobs:
  ios:
    name: iOS (Simulator build + launch)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # Capacitor 8 CLI requires Node >= 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 40
          test -d ios/build/Build/Products/Debug-iphonesimulator/App.app

      - name: Launch on a simulated iPhone and screenshot
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r in d if 'iOS' in r for x in d[r] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" ios/build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$DEVICE" com.road2cissp.app
          sleep 20
          xcrun simctl io "$DEVICE" screenshot ios-launch.png
          # The app must still be running (a crash on launch would have killed it).
          xcrun simctl spawn "$DEVICE" launchctl list | grep -q com.road2cissp.app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: |
            ios-launch.png
            ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: ignore

  android:
    name: Android (debug APK + signed Play bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # Capacitor 8 CLI requires Node >= 22
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      # Upload-key signed bundle for Google Play. Play re-signs it with the app signing key.
      - name: Signed Play bundle (.aab)
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          # Play needs a higher versionCode for every upload; the run number only goes up.
          export ANDROID_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: android-play-bundle
          path: android/app/build/outputs/bundle/release/*.aab

  # TestFlight upload, on demand only. Needs an Apple Developer account and these repo secrets:
  #   APPLE_TEAM_ID       10-character Team ID (developer.apple.com > Membership)
  #   ASC_KEY_ID          App Store Connect API key ID   (App Store Connect > Users and Access >
  #   ASC_ISSUER_ID       API key issuer ID               Integrations > App Store Connect API;
  #   ASC_KEY_P8_BASE64   the .p8 key file, base64        role "App Manager")
  # Signing is automatic: Xcode creates the certificate and profile with the API key.
  testflight:
    name: iOS (TestFlight upload)
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - name: Check Apple secrets
        run: |
          missing=""
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing (see the comment above this job in mobile.yml)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # Capacitor 8 CLI requires Node >= 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Archive (automatic signing via the App Store Connect API key)
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 -d > "$KEY"
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" | tail -n 40
      - name: Upload to TestFlight
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$OPTS"
          plutil -insert method -string app-store-connect "$OPTS"
          plutil -insert destination -string upload "$OPTS"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$OPTS"
          plutil -insert signingStyle -string automatic "$OPTS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$OPTS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -f "$KEY"
